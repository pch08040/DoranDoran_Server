# 로컬 개발용 데이터베이스와 Redis.
#
#   docker compose up -d --wait   기동 (--wait 을 붙이면 '준비 완료'까지 기다려준다)
#   docker compose ps             상태 확인
#   docker compose down           정지
#   docker compose down -v        정지 + 데이터까지 삭제 (완전 초기화)
#
# 운영 환경에서는 이 파일을 쓰지 않는다.
# Cloud SQL(PostgreSQL)과 외부 Redis를 사용한다. → DEV_GUIDE.md 7장 참고

services:
  postgres:
    # 버전을 15로 고정한다. 'latest'로 두면 어느 날 갑자기 메이저 버전이 올라가
    # 예고 없이 동작이 달라질 수 있다.
    # ⚠️ 나중에 Cloud SQL을 만들 때도 같은 15로 맞춰야 로컬과 운영이 어긋나지 않는다.
    image: postgres:15
    container_name: dorandoran-postgres

    # unless-stopped: 맥을 껐다 켜면 자동으로 다시 뜬다.
    # 단, 내가 직접 멈춘 경우에는 계속 멈춰 있다.
    # (always는 내가 멈춰도 재부팅 때 되살아나서 헷갈린다)
    restart: unless-stopped

    ports:
      # 왼쪽이 내 맥의 포트, 오른쪽이 컨테이너 안의 포트.
      # 맥에 PostgreSQL을 따로 설치하는 경우 기본 포트인 5432가 겹치므로
      # 일부러 5431로 비켜서 노출한다. (.env의 DB_PORT와 같아야 한다)
      - "5431:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      # DB 데이터를 이 폴더에 보관한다. 컨테이너를 지워도 데이터는 남는다.
      - ./postgres-data:/var/lib/postgresql/data

    # 컨테이너가 '떴다'와 '쓸 준비가 됐다'는 다르다.
    # 이 검사가 통과해야 진짜 접속 가능한 상태다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # 전화번호 인증번호를 3분간 보관하는 용도.
    # alpine은 용량이 작은 경량 버전이다.
    image: redis:7-alpine
    container_name: dorandoran-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    # ⚠️ Redis에는 일부러 볼륨(저장 공간)을 붙이지 않는다.
    #    여기 담기는 건 3분 뒤 사라질 인증번호뿐이라 보존할 이유가 없다.
    #    Phase 6(채팅)에서 용도가 늘어나면 그때 다시 판단한다.

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
